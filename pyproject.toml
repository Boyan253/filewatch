[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filewatch"
version = "0.1.0"
description = "Run a command whenever files change - a dependency-free watch loop with debouncing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/filewatch"

[project.scripts]
filewatch = "filewatch:main"

[tool.setuptools]
py-modules = ["filewatch"]
